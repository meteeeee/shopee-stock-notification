name: Shopee Stock Restock Monitor

on:
  schedule:
    # Runs every 10 minutes (GitHub Action cron syntax)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Check Shopee Stock & Notify Discord
        env:
          SHOPEE_COOKIE: ${{ secrets.SHOPEE_COOKIE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          SHOPEE_TARGET_URL: 'https://id.shp.ee/M7J73Lp5'
        run: node -e "require('./services/tracker').tracker.checkNow()"
